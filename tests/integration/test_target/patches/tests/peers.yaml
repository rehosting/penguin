# Ground-truth check for the socket peer graph: cause a real conversation in
# the guest, then require processes.peers() to find it.
plugins:
  processes:
    enabled: true
    write_map: false
  peers_verify:
    enabled: true
    port: 9999
    settle_seconds: 3
    max_wait_seconds: 25
  verifier:
    conditions:
      peers_finds_real_conversation:
        type: file_contains
        file: peers_verify.txt
        string: PEERS_VERIFY=PASS

static_files:
  /tests/peers.sh:
    type: inline_file
    contents: |
      #!/igloo/utils/sh
      # empty_fs has no network config at all, so loopback has to be brought up
      # before anything can connect to 127.0.0.1.
      /igloo/utils/busybox ifconfig lo 127.0.0.1 up 2>/dev/null

      # Listener, then a client that HOLDS the connection open: `sleep` keeps the
      # client's stdin from hitting EOF, so the socket pair stays ESTABLISHED
      # long enough to be observed instead of racing through TIME_WAIT.
      /igloo/utils/busybox nc -l -p 9999 >/dev/null 2>&1 &
      /igloo/utils/busybox sleep 1
      ( /igloo/utils/busybox sleep 300 | /igloo/utils/busybox nc 127.0.0.1 9999 >/dev/null 2>&1 ) &

      echo "/tests/peers.sh PASS"
      exit 0
    mode: 73
